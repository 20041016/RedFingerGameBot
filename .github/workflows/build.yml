name: Build RedFinger GameBot APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'source.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source
        run: |
          mkdir extracted
          unzip source.zip -d extracted
          PROJECT_DIR=$(find extracted -name settings.gradle -o -name settings.gradle.kts | head -n 1 | xargs dirname)
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          test -n "$PROJECT_DIR"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      # ===== 新增：把 Secrets 里的 Base64 还原成 .jks 文件 =====
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\n\r ' | base64 --decode > $RUNNER_TEMP/my-release-key.jks

      # ===== 修改：assembleDebug → assembleRelease，并注入签名参数 =====
      - name: Build Signed Release APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon :app:assembleRelease \
            -Pandroid.injected.signing.store.file=$RUNNER_TEMP/my-release-key.jks \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"

      # ===== 修改：产物路径改成 release 目录 =====
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RedFingerGameBot-APK
          path: extracted/**/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
