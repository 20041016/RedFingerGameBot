
name: Build RedFinger GameBot APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'source.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source
        shell: bash
        run: |
          set -e

          mkdir -p extracted
          unzip -o source.zip -d extracted

          PROJECT_FILE=$(find extracted -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "错误：没有找到 settings.gradle"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "错误：没有找到 app/build.gradle"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "项目目录：$PROJECT_DIR"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build Release APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=== 开始构建 Release APK ==="
          gradle --no-daemon :app:assembleRelease

          echo "=== 搜索所有 APK 文件 ==="

          find "$PROJECT_DIR" -type f -name "*.apk" -print

          mapfile -t APK_FILES < <(
            find "$PROJECT_DIR" -type f \
              -name "*.apk" \
              ! -iname "*debug*.apk" \
              ! -iname "*aligned*.apk" \
              ! -path "*/debug/*"
          )

          if [ "${#APK_FILES[@]}" -eq 0 ]; then
            echo "错误：Gradle 构建成功，但没有找到 APK"
            exit 1
          fi

          if [ "${#APK_FILES[@]}" -gt 1 ]; then
            echo "错误：发现多个 APK，无法自动确定目标文件："
            printf '%s\n' "${APK_FILES[@]}"
            exit 1
          fi

          UNSIGNED_APK="${APK_FILES[0]}"

          echo "找到 Release APK：$UNSIGNED_APK"
          echo "UNSIGNED_APK=$UNSIGNED_APK" >> "$GITHUB_ENV"

      - name: Prepare signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "错误：缺少签名配置 Secrets"
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

          if [ ! -s "$RUNNER_TEMP/release.jks" ]; then
            echo "错误：签名文件生成失败"
            exit 1
          fi

          keytool -list \
            -keystore "$RUNNER_TEMP/release.jks" \
            -storepass "$KEYSTORE_PASSWORD"

          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Sign Release APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"

          if [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "错误：签名 Secrets 不完整"
            exit 1
          fi

          ALIGNED_APK="$RUNNER_TEMP/app-release-aligned.apk"
          SIGNED_APK="$RUNNER_TEMP/app-release.apk"

          echo "=== APK 对齐 ==="

          "$ZIPALIGN" -f -v 4 \
            "$UNSIGNED_APK" \
            "$ALIGNED_APK"

          echo "=== APK 正式签名 ==="

          "$APKSIGNER" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"

          echo "=== 验证 APK 签名 ==="

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$SIGNED_APK"

          if [ ! -s "$SIGNED_APK" ]; then
            echo "错误：签名 APK 不存在或文件为空"
            exit 1
          fi

          echo "SIGNED_APK=$SIGNED_APK" >> "$GITHUB_ENV"

          echo "正式签名完成"

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: RedFingerGameBot-APK
          path: ${{ runner.temp }}/app-release.apk
          if-no-files-found: error
          retention-days: 30
